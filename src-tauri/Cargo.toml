[package]
name = "simplebench"
version = "0.3.0"
license = "Apache-2.0"
description = "A workspace for terminal-driven development"
authors = ["Maciej Kolerski <woro@tanieddosy.pl>"]
repository = "https://github.com/MaciejKolerski/simplebench"
edition = "2021"
publish = false

[lib]
# A distinct library name avoids a Windows artifact name collision with the binary.
name = "simplebench_lib"

[profile.dev]
# Retain backtrace locations without large debug and incremental artifacts.
debug = "line-tables-only"
incremental = false

[features]
native-smoke = []

[[example]]
name = "macos-traffic-lights"
path = "../tests/native/macos-traffic-lights.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
percent-encoding = "2"
sha2 = "0.10"
notify = "8.2"
tempfile = "3"
ignore = "0.4"
regex = "1"
trash = "5"
toml_edit = "0.25"
tauri-plugin-updater = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
plist = "1.8"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSView", "NSButton"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString"] }
