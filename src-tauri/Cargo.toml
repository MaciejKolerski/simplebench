[package]
name = "simplebench"
version = "0.1.0"
description = "A workspace for terminal-driven development"
edition = "2021"
publish = false

[lib]
# A distinct library name avoids a Windows artifact name collision with the binary.
name = "simplebench_lib"

[profile.dev]
# Retain backtrace locations without large debug and incremental artifacts.
debug = "line-tables-only"
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
sha2 = "0.10"
notify = "8.2"
tempfile = "3"
ignore = "0.4"
regex = "1"
trash = "5"
toml_edit = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
