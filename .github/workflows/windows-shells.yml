name: Windows shell checks

on:
  pull_request:
    paths:
      - "src-tauri/src/shell.rs"
      - "src-tauri/src/terminal.rs"
      - "src-tauri/shell/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/windows-shells.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shells:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check PowerShell, WSL discovery, and path handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked shell::tests -- --nocapture
